<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <link rel = "stylesheet" href = "/cssFiles/login.css">
        <link rel = "stylesheet" href = "/cssFiles/nav.css">
        <script src="https://code.jquery.com/jquery-1.10.2.js"></script>
    </head>
    <body>
        <!-- The core Firebase JS SDK is always required and must be listed first -->
        <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
        <!-- TODO: Add SDKs for Firebase products that you want to use-->
        <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"></script>
        
        <script src="/jsFiles/script.js"></script>
        <div class="container">
            <h1>Login</h1>
            <form action="/phpFiles/signup.php" method="post">
                <div class="email_box">
                    <label for="email">Email</label><br>
                    <input required type="email" id="email" name="email" placeholder="Enter Email">
                </div>
                <div class="psw_box">
                    <label for="psw">Password</label><br>
                    <input required type="password" id="psw" name="psw" placeholder="Enter Password">
                </div>
                <div class="clearfix">
                    <button onclick="cancel()" type="button" class="cancel">Back</button>
                    <script src="/jsFiles/script.js"></script>
                    <button type="submit" class="login">Login</button>
                </div>
                <div class="register_link">
                    <p>Don't have an account? <a href="/html/signupPage.html">Sign Up</a></p>
                </div>
            </form>
        </div>
    </body>
</html>
