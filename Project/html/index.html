<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <link rel = "stylesheet" href = "/cssFiles/login.css">
        <link rel = "stylesheet" href = "/cssFiles/nav.css">
        <script src="https://code.jquery.com/jquery-1.10.2.js"></script>
    </head>
    <body>
        <div class="container">
            <h1>Login</h1>
            <form action="" id="user_login" onsubmit="proceed()">
                <div class="email_box">
                    <label for="email">Email</label><br>
                    <input required type="email" id="email" name="email" placeholder="Enter Email">
                </div>
                <div class="psw_box">
                    <label for="psw">Password</label><br>
                    <input required type="password" id="psw" name="psw" placeholder="Enter Password">
                </div>
                <div class="clear">
                    <button type="submit" class="proceed">Proceed</button>
                </div>
                <div class="register_link">
                    <p>Don't have an account? <a href="/html/signupPage.html">Sign Up</a></p>
                </div>
            </form>
        </div>
        <script src="/jsFiles/new.js"></script>
    </body>
</html>
